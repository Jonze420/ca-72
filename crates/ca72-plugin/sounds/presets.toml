# The CA-72's factory presets, built into the plug-in. Each preset sets the panel as its dials
# print (a choice by its index: RANGE LO, 32', 16', 8', 4', 2' are 0 to 5; WAVEFORM triangle
# to narrow rectangle 0 to 5; a switch 0 off, 1 on); a control it does not name is at its
# default, but MIDI BEND RANGE (the player's) is left as it is. `poly` (0 or 1), `voices`,
# `entropy` and `spread` (0 to 100) are POLY, VOICES, ENTROPY and SPREAD: every preset names
# them. The PITCH wheel is never part of a preset.
#
# The fifteen after Bass and Lead are documented patches for the instrument the CA-72 models,
# under names of our own: its maker's 1974 sound charts, its 2016 reissue's patch sheets, and
# two recreations by ear. Ladder Kick to Pink Riser are a drum kit and a riser made from the
# panel alone, one instance a drum; Warped Pad, last, is eight POLY voices drifting with
# ENTROPY. MAIN OUTPUT VOLUME levels them against each other (measured on the
# model), not the charts' listening level.
format = 1

[[preset]]
name = "Bass"
description = "Two sawtooths at 16', a hair apart, through a closed, plucked filter."
tags = ["bass"]

[preset.values]
osc1_range = 2
osc2_on = 1
osc2_range = 2
osc2_frequency = 0.1
cutoff = -2.0
emphasis = 3.5
contour_amount = 3.5
filter_decay = 3.5
filter_sustain = 2.5
loudness_decay = 3.0
volume = 9.6
poly = 0
voices = 4
entropy = 0
spread = 0

